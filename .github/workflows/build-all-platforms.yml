name: Build All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Download Essentia model
      run: |
        cd models
        curl -O https://essentia.upf.edu/models/feature-extractors/discogs-effnet/discogs_multi_embeddings-effnet-bs64-1.pb
        cd ..
    
    - name: Build macOS app
      run: python build_app.py
    
    - name: Verify macOS build
      run: |
        echo "📦 Checking macOS build..."
        APP_SIZE=$(du -sh "dist/Cosine Companion.app" | cut -f1)
        echo "✅ App size: $APP_SIZE"
        find "dist/Cosine Companion.app" -name "numpy" -type d | head -1 || echo "⚠️ numpy not found"
        find "dist/Cosine Companion.app" -name "pandas" -type d | head -1 || echo "⚠️ pandas not found"
    
    - name: Create DMG
      run: |
        # Install create-dmg
        brew install create-dmg
        
        # Create DMG
        create-dmg \
          --volname "Cosine Companion" \
          --volicon "assets/coco_logo.icns" \
          --window-pos 200 120 \
          --window-size 800 400 \
          --icon-size 100 \
          --icon "Cosine Companion.app" 200 190 \
          --hide-extension "Cosine Companion.app" \
          --app-drop-link 600 185 \
          "Cosine-Companion-Installer.dmg" \
          "dist/Cosine Companion.app" || true
    
    - name: Upload macOS app
      uses: actions/upload-artifact@v4
      with:
        name: Cosine-Companion-macOS
        path: |
          dist/Cosine Companion.app
          Cosine-Companion-Installer.dmg
        retention-days: 90
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          Cosine-Companion-Installer.dmg
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Download Essentia model
      run: |
        cd models
        curl -O https://essentia.upf.edu/models/feature-extractors/discogs-effnet/discogs_multi_embeddings-effnet-bs64-1.pb
        cd ..
      shell: bash
    
    - name: Create Windows icon
      run: |
        pip install Pillow
        python create_windows_icon.py
      continue-on-error: true
      env:
        PYTHONIOENCODING: utf-8
    
    - name: Build Windows executable
      run: python build_app.py
      env:
        PYTHONIOENCODING: utf-8
    
    - name: Verify Windows build
      run: |
        echo "📦 Checking Windows build..."
        Get-ChildItem "dist\Cosine Companion" -Recurse | Measure-Object -Property Length -Sum | Select-Object @{Name="Size(MB)";Expression={[math]::Round($_.Sum / 1MB, 2)}}
        if (Test-Path "dist\Cosine Companion\_internal\numpy") {
          echo "✅ numpy found"
        } else {
          echo "⚠️ numpy not found"
        }
        if (Test-Path "dist\Cosine Companion\_internal\pandas") {
          echo "✅ pandas found"
        } else {
          echo "⚠️ pandas not found"
        }
      shell: powershell
    
    - name: Create Windows ZIP
      run: |
        cd dist
        Compress-Archive -Path "Cosine Companion" -DestinationPath "Cosine-Companion-Windows.zip"
        cd ..
      shell: powershell
    
    - name: Upload Windows application
      uses: actions/upload-artifact@v4
      with:
        name: Cosine-Companion-Windows
        path: |
          dist/Cosine Companion/
          dist/Cosine-Companion-Windows.zip
        retention-days: 90
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/Cosine-Companion-Windows.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libportaudio2 libsndfile1
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Download Essentia model
      run: |
        cd models
        curl -O https://essentia.upf.edu/models/feature-extractors/discogs-effnet/discogs_multi_embeddings-effnet-bs64-1.pb
        cd ..
    
    - name: Build Linux executable
      run: python build_app.py
    
    - name: Upload Linux executable
      uses: actions/upload-artifact@v4
      with:
        name: Cosine-Companion-Linux
        path: dist/Cosine Companion
        retention-days: 90
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/Cosine Companion
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

