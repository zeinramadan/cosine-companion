name: Tests (macOS)

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-macos-arm64-py311.lock

      # Install the same complete, hashed environment as the app build. This
      # deliberately includes the large Essentia wheel: dependency parity is
      # the property this job protects.
      - name: Install locked build and test dependencies
        run: python -m pip install --require-hashes -r requirements-macos-arm64-py311.lock

      - name: Run tests
        run: python -m pytest -q

  dependency-canary:
    # HEAD-of-PyPI incompatibilities should be visible without blocking work on
    # the reproducible release set.
    continue-on-error: true
    timeout-minutes: 45
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install unpinned runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1

      - name: Run tests against current dependency releases
        run: python -m pytest -q
