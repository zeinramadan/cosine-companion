name: Build Windows Executable

on:
  # Trigger on version tags
  push:
    tags:
      - 'v*'
  # Or trigger manually
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Download Essentia model
      run: |
        cd models
        curl -O https://essentia.upf.edu/models/feature-extractors/discogs-effnet/discogs_multi_embeddings-effnet-bs64-1.pb
        cd ..
      shell: bash
    
    - name: Create Windows icon
      run: |
        pip install Pillow
        python create_windows_icon.py
      continue-on-error: true
      env:
        PYTHONIOENCODING: utf-8
    
    - name: Build Windows executable
      run: python build_app.py
      env:
        PYTHONIOENCODING: utf-8
    
    - name: Upload executable as artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cosine-Companion-Windows
        path: dist/Cosine Companion.exe
        retention-days: 90
    
    - name: Create Release (if tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/Cosine Companion.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

