name: Build Windows Executable

on:
  # Trigger on version tags
  push:
    tags:
      - 'v*'
  # Or trigger manually
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Download Essentia model
      run: |
        cd models
        curl -O https://essentia.upf.edu/models/feature-extractors/discogs-effnet/discogs_multi_embeddings-effnet-bs64-1.pb
        cd ..
      shell: bash
    
    - name: Create Windows icon
      run: |
        pip install Pillow
        python create_windows_icon.py
      continue-on-error: true
      env:
        PYTHONIOENCODING: utf-8
    
    - name: Build Windows executable
      run: python build_app.py
      env:
        PYTHONIOENCODING: utf-8
    
    - name: Verify Windows build
      run: |
        Write-Host "Checking Windows build..."
        
        # Check total size
        $size = (Get-ChildItem "dist\Cosine Companion" -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
        Write-Host "[INFO] Total build size: $([math]::Round($size, 2)) MB"
        
        # Check for executable
        if (Test-Path "dist\Cosine Companion\Cosine Companion.exe") {
          Write-Host "[OK] Executable found"
        } else {
          Write-Host "[ERROR] Executable NOT found!"
        }
        
        # Check for _internal directory
        if (Test-Path "dist\Cosine Companion\_internal") {
          Write-Host "[OK] _internal directory exists"
          
          # List top-level contents of _internal
          Write-Host "`n[INFO] Contents of _internal directory:"
          Get-ChildItem "dist\Cosine Companion\_internal" -Directory | Select-Object -First 20 Name | ForEach-Object { Write-Host "  - $($_.Name)" }
          
          # Check for numpy
          if (Test-Path "dist\Cosine Companion\_internal\numpy") {
            Write-Host "`n[OK] numpy found"
          } else {
            Write-Host "`n[ERROR] numpy NOT found!"
          }
          
          # Check for pandas
          if (Test-Path "dist\Cosine Companion\_internal\pandas") {
            Write-Host "[OK] pandas found"
          } else {
            Write-Host "[ERROR] pandas NOT found!"
          }
          
          # Check for faiss
          $faiss = Get-ChildItem "dist\Cosine Companion\_internal" -Filter "*faiss*" -Recurse | Select-Object -First 1
          if ($faiss) {
            Write-Host "[OK] faiss found"
          } else {
            Write-Host "[WARNING] faiss not found"
          }
        } else {
          Write-Host "[ERROR] _internal directory NOT found!"
        }
      shell: powershell
    
    - name: Create Windows ZIP
      run: |
        cd dist
        Compress-Archive -Path "Cosine Companion" -DestinationPath "Cosine-Companion-Windows.zip"
        cd ..
      shell: powershell
    
    - name: Upload Windows application
      uses: actions/upload-artifact@v4
      with:
        name: Cosine-Companion-Windows
        path: dist/Cosine-Companion-Windows.zip
        retention-days: 90
    
    - name: Create Release (if tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/Cosine-Companion-Windows.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

