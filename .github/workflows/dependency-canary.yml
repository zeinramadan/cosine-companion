name: Dependency canary (macOS)

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-canary:
    timeout-minutes: 45
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install unpinned runtime dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1

      - name: Verify current build dependency imports
        run: python -c "import build_app; assert build_app.check_dependencies()"

      - name: Run tests against current dependency releases
        run: python -m pytest -q

      - name: Record resolved dependency versions
        if: always()
        run: |
          {
            echo "## Resolved dependencies"
            echo '```text'
            python -m pip freeze
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
