name: Build macOS

on:
  workflow_dispatch:  # Manual trigger
  push:
    tags:
      - 'v*'  # Trigger on version tags

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache Essentia model
      id: cache-model
      uses: actions/cache@v4
      with:
        path: models/discogs_multi_embeddings-effnet-bs64-1.pb
        key: essentia-model-v1
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Download Essentia model
      if: steps.cache-model.outputs.cache-hit != 'true'
      run: |
        mkdir -p models
        cd models
        curl -L -O "https://essentia.upf.edu/models/feature-extractors/discogs-effnet/discogs_multi_embeddings-effnet-bs64-1.pb"
    
    - name: Build app
      run: python build_app.py
    
    - name: Create DMG
      run: |
        brew install create-dmg
        create-dmg "dist/Cosine Companion.app" "dist" || true
        # Rename to a consistent name
        mv dist/*.dmg "dist/Cosine-Companion-macOS.dmg" 2>/dev/null || true
    
    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: Cosine-Companion-macOS
        path: dist/Cosine-Companion-macOS.dmg
        retention-days: 90
    
    - name: Create Release (if tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/Cosine-Companion-macOS.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
