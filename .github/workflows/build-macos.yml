name: Build macOS

on:
  workflow_dispatch:  # Manual trigger only

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      ESSENTIA_MODEL_PATH: models/discogs_multi_embeddings-effnet-bs64-1.pb
      ESSENTIA_MODEL_URL: https://essentia.upf.edu/models/feature-extractors/discogs-effnet/discogs_multi_embeddings-effnet-bs64-1.pb
      ESSENTIA_MODEL_SHA256: 2c964064951217e1e345461cf88884086a21f4bca2ae0d48187ee75edc263cd7
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version-file: .python-version
        cache: 'pip'
        cache-dependency-path: |
          requirements-macos-arm64-py311.lock
          build-constraints.txt
    
    - name: Cache Essentia model
      id: cache-model
      uses: actions/cache@v4
      with:
        path: ${{ env.ESSENTIA_MODEL_PATH }}
        key: essentia-model-sha256-${{ env.ESSENTIA_MODEL_SHA256 }}
    
    - name: Install dependencies
      env:
        PIP_CONSTRAINT: ${{ github.workspace }}/build-constraints.txt
      run: |
        python -m pip install --require-hashes -r requirements-macos-arm64-py311.lock
        python -c "import sys; print('Python:', sys.executable)"
    
    - name: Download Essentia model
      if: steps.cache-model.outputs.cache-hit != 'true'
      run: |
        mkdir -p "$(dirname "$ESSENTIA_MODEL_PATH")"
        curl --fail --show-error --location \
          --output "${ESSENTIA_MODEL_PATH}.download" \
          "$ESSENTIA_MODEL_URL"
        mv "${ESSENTIA_MODEL_PATH}.download" "$ESSENTIA_MODEL_PATH"

    # Deliberately unconditional: a cache hit is untrusted input too.
    - name: Verify Essentia model
      run: python build_app.py --verify-model "$ESSENTIA_MODEL_PATH"
    
    - name: Build app
      run: |
        python build_app.py
        test -f "dist/Cosine Companion.app/Contents/MacOS/Cosine Companion"
        python build_app.py --verify-model "dist/Cosine Companion.app/Contents/Resources/$ESSENTIA_MODEL_PATH"
    
    - name: Create DMG
      run: |
        brew install create-dmg
        create-dmg \
          --volname "Cosine Companion" \
          --volicon "assets/coco_logo.icns" \
          --window-pos 200 120 \
          --window-size 800 400 \
          --icon-size 100 \
          --app-drop-link 600 185 \
          "Cosine-Companion-macOS.dmg" \
          "dist/Cosine Companion.app"
    
    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: Cosine-Companion-macOS
        path: Cosine-Companion-macOS.dmg
        retention-days: 90
