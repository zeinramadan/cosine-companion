name: Build macOS

on:
  workflow_dispatch:  # Manual trigger only

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: requirements-macos-arm64-py311.lock
    
    - name: Cache Essentia model
      id: cache-model
      uses: actions/cache@v4
      with:
        path: models/discogs_multi_embeddings-effnet-bs64-1.pb
        key: essentia-model-v1
    
    - name: Install dependencies
      env:
        PIP_CONSTRAINT: ${{ github.workspace }}/build-constraints.txt
      run: |
        python -m pip install --require-hashes -r requirements-macos-arm64-py311.lock
        python -c "import sys; print('Python:', sys.executable)"
    
    - name: Download Essentia model
      if: steps.cache-model.outputs.cache-hit != 'true'
      run: |
        mkdir -p models
        cd models
        curl -L -O "https://essentia.upf.edu/models/feature-extractors/discogs_multi_embeddings/discogs_multi_embeddings-effnet-bs64-1.pb"
    
    - name: Build app
      run: |
        python build_app.py
        test -f "dist/Cosine Companion.app/Contents/MacOS/Cosine Companion"
    
    - name: Create DMG
      run: |
        brew install create-dmg
        create-dmg \
          --volname "Cosine Companion" \
          --volicon "assets/coco_logo.icns" \
          --window-pos 200 120 \
          --window-size 800 400 \
          --icon-size 100 \
          --app-drop-link 600 185 \
          "Cosine-Companion-macOS.dmg" \
          "dist/Cosine Companion.app"
    
    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: Cosine-Companion-macOS
        path: Cosine-Companion-macOS.dmg
        retention-days: 90
