name: Build macOS (Intel x86_64)

on:
  workflow_dispatch:  # Manual trigger only

permissions:
  contents: write

jobs:
  build-macos-intel:
    runs-on: macos-13  # Intel-based runner

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Cache Essentia model
      id: cache-model
      uses: actions/cache@v4
      with:
        path: models/discogs_multi_embeddings-effnet-bs64-1.pb
        key: essentia-model-v1

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        python -c "import sys, platform; print('Python:', sys.executable); print('Platform:', platform.platform())"

    - name: Download Essentia model
      if: steps.cache-model.outputs.cache-hit != 'true'
      run: |
        mkdir -p models
        cd models
        curl -L -O "https://essentia.upf.edu/models/feature-extractors/discogs_multi_embeddings/discogs_multi_embeddings-effnet-bs64-1.pb"

    - name: Prepare Intel-specific spec (avoid scanning all essentia submodules)
      run: |
        python - << 'PY'
        import io, sys
        p = 'cosine-companion.spec'
        out = 'cosine-companion-intel.spec'
        s = open(p, 'r').read()
        s = s.replace("essentia_hidden = collect_submodules('essentia')", "essentia_hidden = []")
        if "essentia.standard" not in s:
            s = s.replace("'essentia',", "'essentia',\n        'essentia.standard',")
        with open(out, 'w') as f:
            f.write(s)
        print('Wrote', out)
        PY

    - name: Build app (Intel x86_64)
      run: |
        pyinstaller --clean --noconfirm --log-level INFO cosine-companion-intel.spec
        test -f "dist/Cosine Companion.app/Contents/MacOS/Cosine Companion"
        file "dist/Cosine Companion.app/Contents/MacOS/Cosine Companion" || true

    - name: Create DMG
      run: |
        brew install create-dmg
        create-dmg \
          --volname "Cosine Companion" \
          --volicon "assets/coco_logo.icns" \
          --window-pos 200 120 \
          --window-size 800 400 \
          --icon-size 100 \
          --app-drop-link 600 185 \
          "Cosine-Companion-macOS-x86_64.dmg" \
          "dist/Cosine Companion.app"

    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: Cosine-Companion-macOS-x86_64
        path: Cosine-Companion-macOS-x86_64.dmg
        retention-days: 90
