name: dj-companion
channels:
  - conda-forge
  - defaults
dependencies:
  # Python. Must equal .python-version, which is the one file that states the
  # version; tests/test_workflows_do_not_state_a_python_version.py enforces
  # it. This pinned 3.10 while CI tested and the app shipped 3.11, so a
  # contributor's conda environment was a different interpreter from the one
  # anything was verified on.
  - python=3.11

  # Core data processing
  - numpy>=1.20.0
  - pandas>=1.3.0
  - pyarrow>=12

  # Audio processing
  - soundfile>=0.10.0

  # XML parsing
  - lxml>=4.6.0

  # CLI interface
  - typer>=0.4.0

  # UI / Icons
  - pillow>=9.0.0

  # Packaging (for building standalone app)
  - pyinstaller>=5.0.0

  # Pip-only packages
  - pip
  - pip:
      - essentia-tensorflow>=2.1b6.dev0
